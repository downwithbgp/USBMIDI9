# CI for the portable USBMIDI9 core: build and test with GCC and Clang.
# The Classic Mac OS layers (classic/, probe/) are compile-checked on
# Linux against minimal stub headers (make check-classic); the real
# driver/probe build happens in CodeWarrior on the Power Mac G4.

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests
        run: make test CC=${{ matrix.cc }}
      - name: Sanitizer run (ASan + UBSan)
        if: matrix.cc == 'gcc'
        run: make test-sanitize CC=${{ matrix.cc }}
      - name: Classic sources compile check (stub headers)
        run: make check-classic CC=${{ matrix.cc }}
      - name: 'OMdv' 128 packaging tool check (OMdvData build+validate)
        run: make check-omdvdata CC=${{ matrix.cc }}
